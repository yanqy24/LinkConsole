<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-pure="true">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinkConsole — 远程连接与管理</title>
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>

<div class="app">

  <!-- ============ 顶部栏 ============ -->
  <header class="titlebar" id="titlebar">
    <div class="tb-left">
      <button class="brand" id="btnMenu" data-tip="LinkConsole 菜单">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none"><rect x="2.6" y="4.2" width="18.8" height="15.6" rx="4.2" stroke="currentColor" stroke-width="1.6"/><path d="M7 10.2l3.1 2.4L7 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.6 15.2h4.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-text">LinkConsole</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dropdown" id="mainMenu">
        <div class="ctx-head"><span class="ctx-head-main"><span class="ctx-head-t">LinkConsole</span><span class="ctx-head-s">远程连接与管理</span></span></div>
        <button class="ctx-item" data-act="new-host" data-icon="host"><span class="ctx-ico"></span><span class="ctx-label">新建主机</span><span class="ctx-kbd">Ctrl N</span></button>
        <button class="ctx-item" data-act="new-session" data-icon="terminal"><span class="ctx-ico"></span><span class="ctx-label">新建会话</span><span class="ctx-kbd">Ctrl T</span></button>
        <div class="ctx-sep"></div>
        <button class="ctx-item" data-act="files" data-icon="folder"><span class="ctx-ico"></span><span class="ctx-label">文件管理</span><span class="ctx-kbd">Ctrl B</span></button>
        <button class="ctx-item" data-act="shortcuts" data-icon="keyboard"><span class="ctx-ico"></span><span class="ctx-label">快捷键</span><span class="ctx-kbd">?</span></button>
        <div class="ctx-sep"></div>
        <button class="ctx-item" data-act="settings" data-icon="settings"><span class="ctx-ico"></span><span class="ctx-label">偏好设置</span><span class="ctx-kbd">Ctrl ,</span></button>
        <button class="ctx-item" data-act="about" data-icon="info"><span class="ctx-ico"></span><span class="ctx-label">关于 LinkConsole</span><span class="ctx-kbd" id="aboutVersion">1.1.0</span></button>
      </div>
    </div>

    <div class="mode-switch" id="modeSwitch">
      <span class="glider" id="glider"></span>
      <button class="mode-btn is-active" data-mode="workbench" data-tip="工作台模式|多会话卡片预览，单终端专注操作">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/><path d="M7.6 13.4l2 1.6-2 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>工作台模式</span>
        <i class="qmark">?</i>
      </button>
      <button class="mode-btn" data-mode="multi" data-tip="多控模式|指令多机并发执行，聚合输出来源清晰">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3.6" width="8" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="3.6" width="8" height="7" rx="2"/><rect x="13" y="3.6" width="8" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="13.4" width="8" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13.4" width="8" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>多控模式</span>
        <i class="qmark">?</i>
      </button>
    </div>

    <div class="tb-right">
      <button class="icon-btn" id="btnTheme" data-tip="切换深色 / 浅色主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none"><path d="M20 14.2A8.4 8.4 0 019.8 4 8.4 8.4 0 1020 14.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" data-tip="设置">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.6 1.6 0 00.32 1.77l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.6 1.6 0 00-1.77-.32 1.6 1.6 0 00-.97 1.46V21a2 2 0 11-4 0v-.11a1.6 1.6 0 00-1.05-1.46 1.6 1.6 0 00-1.77.32l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.6 1.6 0 004.6 15a1.6 1.6 0 00-1.46-.97H3a2 2 0 110-4h.11A1.6 1.6 0 004.6 9a1.6 1.6 0 00-.32-1.77l-.06-.06a2 2 0 112.83-2.83l.06.06A1.6 1.6 0 009 4.72 1.6 1.6 0 009.97 3.26V3a2 2 0 114 0v.11a1.6 1.6 0 00.97 1.46 1.6 1.6 0 001.77-.32l.06-.06a2 2 0 112.83 2.83l-.06.06A1.6 1.6 0 0019.4 9v.09a1.6 1.6 0 001.46.97H21a2 2 0 110 4h-.11A1.6 1.6 0 0019.4 15z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>

      <span class="tb-sep"></span>
      <div class="win-controls" id="winControls">
        <button class="win-btn" id="winMin" data-tip="最小化" aria-label="最小化">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="win-btn" id="winMax" data-tip="最大化" aria-label="最大化">
          <svg class="wm-max" viewBox="0 0 24 24" fill="none"><rect x="5.5" y="5.5" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
          <svg class="wm-restore" viewBox="0 0 24 24" fill="none"><rect x="7.5" y="7.5" width="11" height="11" rx="1.8" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 12.5V6.5a1 1 0 011-1h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="win-btn close" id="winClose" data-tip="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ 主体 ============ -->
  <div class="body">

    <!-- 第一栏：服务器管理 -->
    <aside class="col col-servers" id="serversCol">
      <div class="col-head">
        <div class="col-title">服务器</div>
        <div class="spacer"></div>
        <button class="mini-btn" id="btnAddHost" data-tip="新建主机|支持密码 / 密钥 / 跳板代理">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
        <button class="mini-btn col-collapse" data-col="servers" data-tip="收起服务器栏">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 7l-5 5 5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="col-rail" data-col="servers" data-tip="展开服务器栏">
        <svg viewBox="0 0 24 24" fill="none"><path d="M11 7l5 5-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="rail-text">服务器</span>
      </button>
      <div class="col-scroll" id="serverTree"></div>
      <div class="col-foot">
        <span class="foot-pulse"></span>
        <span id="serverFootText">—</span>
      </div>
    </aside>

    <!-- 第二栏：会话管理 -->
    <aside class="col col-sessions" id="sessionsCol">
      <div class="col-head">
        <div class="col-title" id="sessionsTitle">会话</div>
        <span class="count" id="sessionsCount">0</span>
        <div class="spacer"></div>
        <button class="mini-btn" id="btnSelectAll" data-tip="全选 / 反选">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="mini-btn col-collapse" data-col="sessions" data-tip="收起会话栏">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 7l-5 5 5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="col-rail" data-col="sessions" data-tip="展开会话栏">
        <svg viewBox="0 0 24 24" fill="none"><path d="M11 7l5 5-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="rail-text">会话</span>
      </button>
      <div class="col-scroll" id="sessionList"></div>
      <div class="col-foot" id="sessionsFoot">
        <span id="sessionsFootText">双击主机即可新建会话</span>
      </div>
      <div class="col-resizer" id="sessResizer" title="拖拽调整宽度 · 双击恢复默认"></div>
    </aside>

    <!-- 第三栏：主终端工作区 -->
    <main class="col col-main">
      <div class="workspace">

        <section class="term-panel">
          <div class="term-top">
            <div class="tabs" id="filterTabs"></div>
            <div class="term-top-right">
              <div class="searchbox" id="searchBox">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <input id="searchInput" placeholder="搜索输出…" spellcheck="false" autocomplete="off" />
                <button class="chk-chip" id="chipRegex" data-tip="正则表达式|勾选后按正则解析搜索内容">.*</button>
                <button class="chk-chip" id="chipCase" data-tip="区分大小写">Aa</button>
                <span class="search-count" id="searchCount"></span>
                <button class="search-clear" id="searchClear" hidden>
                  <svg viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
              </div>
              <button class="icon-btn sm" id="btnFiles" data-tip="文件管理|可视目录、拖拽上传与下载">
                <svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7.6a2 2 0 012-2h3.2l1.8 2.2h6a2 2 0 012 2v7.6a2 2 0 01-2 2H5.5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              </button>
              <button class="icon-btn sm" id="btnClear" data-tip="清屏">
                <svg viewBox="0 0 24 24" fill="none"><path d="M5 8h14M9.5 4.8h5M7 8l.8 10.4a1.6 1.6 0 001.6 1.5h5.2a1.6 1.6 0 001.6-1.5L17 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>

          <!-- 终端区域：work = 单会话视图，multi = 多控聚合视图，pool = 离屏会话缓冲 -->
          <div class="term" id="term">
            <div class="term-host" id="termWork" hidden></div>
            <div class="term-host" id="termMulti" hidden></div>
            <div class="term-empty" id="termEmpty">
              <div class="te-logo">
                <svg viewBox="0 0 24 24" fill="none"><rect x="2.6" y="4.2" width="18.8" height="15.6" rx="4.2" stroke="currentColor" stroke-width="1.3"/><path d="M7 10.2l3.1 2.4L7 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.6 15.2h4.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              </div>
              <div class="te-title">尚无活动会话</div>
              <div class="te-sub">双击左侧主机建立连接 · 支持密码 / 密钥 / 代理<br/>还没有主机？先创建一台</div>
              <div class="te-actions">
                <button class="es-btn" id="teNewHost">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>新建主机</span>
                </button>
                <span class="kbd">Ctrl N</span>
              </div>
            </div>
          </div>

          <div class="term-foot">
            <div class="statusbar" id="statusbar"></div>
            <div class="palette-stack" id="palette">
              <div class="palette" id="paletteQuick"></div>
              <div class="palette" id="paletteHistory"></div>
            </div>
            <div class="input-row" id="inputRow">
              <span class="prompt" id="inputPrompt"></span>
              <input id="cmdInput" autocomplete="off" spellcheck="false" placeholder="输入命令，Enter 执行（多控模式下广播到所有已选服务器）" />
              <button class="send-btn" id="btnSend" data-tip="执行 (Enter)">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12h14M13 6.5l5.5 5.5L13 17.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </section>

        <!-- 文件管理侧栏 -->
        <div class="fp-resizer" id="fpResizer" hidden title="拖拽调整宽度 · 双击恢复默认"></div>
        <aside class="file-panel" id="filePanel" hidden>
          <div class="fp-head">
            <div class="fp-head-main">
              <div class="fp-title">文件</div>
              <div class="fp-sub" id="fpSub">—</div>
            </div>
            <button class="icon-btn sm" id="fpClose" data-tip="关闭">
              <svg viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="fp-toolbar">
            <button class="fp-btn" id="fpUp" data-tip="上级目录">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="fp-btn" id="fpRefresh" data-tip="刷新">
              <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 10-2.6 5.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 5.6V12h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="fp-btn" id="fpNewDir" data-tip="新建目录">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3.6" y="5.4" width="16.8" height="13.2" rx="2.6" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
            <div class="spacer"></div>
            <button class="fp-btn primary" id="fpUpload" data-tip="上传文件">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 16v2.4A1.6 1.6 0 006.6 20h10.8a1.6 1.6 0 001.6-1.6V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              上传
            </button>
          </div>
          <div class="fp-crumb" id="fpCrumb"></div>
          <div class="fp-list" id="fpList"></div>
          <div class="fp-transfers" id="fpTransfers">
            <div class="tr-head">
              <span class="tr-title">传输队列 <i id="trCount">0</i></span>
              <span class="spacer"></span>
              <button class="tr-btn" id="trPauseAll" data-tip="暂停全部">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9 5.5v13M15 5.5v13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              </button>
              <button class="tr-btn" id="trClear" data-tip="清除已完成">
                <svg viewBox="0 0 24 24" fill="none"><path d="M5 8h14M9.5 4.8h5M7 8l.8 10.4a1.6 1.6 0 001.6 1.5h5.2a1.6 1.6 0 001.6-1.5L17 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <div class="tr-list" id="trList"></div>
          </div>
          <div class="fp-drop" id="fpDrop" hidden><span>松开鼠标，上传到当前目录</span></div>
        </aside>

      </div>
    </main>
  </div>
</div>

<!-- 离屏会话终端缓冲池 -->
<div id="termPool" aria-hidden="true"></div>

<div class="tooltip" id="tooltip" hidden></div>
<div class="ctx-menu" id="ctxMenu" hidden></div>
<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<div class="complete-pop" id="completePop" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
